name: "Reelier replay"
description: "Gate Dependabot/Renovate bumps: replay recorded agent tool-call workflows at 0 LLM tokens, fail the PR check on drift."
author: "Reelier"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  skill:
    description: >-
      Path (relative to the checked-out repo) to the .skill.md file to
      replay. A single path only — for multiple skills, call this action
      once per skill (see README.md "Run it in CI" for the matrix pattern).
    required: true
  max-level:
    description: >-
      Escalation ceiling passed to `reelier run --max-level`. "0" (the
      default) never calls an LLM — pure deterministic replay, 0 tokens.
      "1" or "2" allow self-healing escalation and require LLM credentials
      to be present in the environment (see README.md "Works with any
      model").
    required: false
    default: "0"
  cloud-url:
    description: >-
      Base URL of the receipt-ledger endpoint to push the receipt to.
      Only used when `cloud-key` is also set.
    required: false
    default: "https://www.reelier.com"
  cloud-key:
    description: >-
      Receipt-ledger API key. When set, `reelier push` runs after a
      successful replay so the receipt accrues in your ledger.
      When unset, the replay is local-only — the job summary is still
      written, nothing is pushed anywhere. Pass this as a GitHub secret,
      never inline.
      WARNING for Dependabot-triggered workflows: a run triggered by
      `dependabot[bot]` only receives secrets from the repo's Dependabot
      secrets scope (Settings → Secrets and variables → Dependabot), NOT
      the regular Actions secrets scope — those are two separate stores.
      If you pass `secrets.REELIER_CLOUD_KEY` here and only added it under
      Actions secrets, it resolves to an empty string on Dependabot PRs,
      the `if: inputs.cloud-key != ''` guard below is false, and the push
      is silently skipped — no error, no log line calling it out. Add the
      secret under the Dependabot scope too if you want pushes on
      Dependabot-triggered runs.
    required: false
    default: ""
  cli-version:
    description: >-
      Exact version of the `reelier` npm package to install for this run.
      Pinned on purpose: a determinism tool should itself install
      deterministically. `reelier` is still 0.x, so npm's caret range
      (`^0.12`) only floats the PATCH digit — it resolves to a max of
      0.12.1, never 0.25.0+ — which silently shipped a 12-versions-stale
      CLI (from before signing, the trust ladder, and the audit log
      existed) to every adopter of this action. Override to test against a
      newer or older CLI; leave at the default for normal use.
    required: false
    default: "0.29.0"
  vars:
    description: >-
      Newline-separated `name=value` pairs, forwarded to `reelier run` as
      `--var name=value` for each line. Optional — most skills declare
      their own inputs and need none.
    required: false
    default: ""
  wrap:
    description: >-
      Newline-separated command lines, forwarded to `reelier run` as
      `--wrap "<command>"` for each line (repeatable, same as the CLI).
      Use this to front your own MCP server / tool process so the replay
      exercises the code that actually changed in a dependency bump —
      e.g. `wrap: "node ./mcp-server.js"`. Required only when the skill
      carries a manifest (`reelier manifest`) or otherwise needs live
      tools instead of the built-in ones (http, fs). Optional — skills
      that only use built-in tools need no wrap.
    required: false
    default: ""
  share:
    description: >-
      Whether the `reelier push` step should pass `--share`, which mints a
      PUBLIC receipt permalink (the CLI is privacy-first by default — a
      push never creates a public receipt unless `--share` is passed).
      Opt-in on purpose: only set this to "true" if you want this run's
      receipt readable by anyone with the link (e.g. so the PR comment can
      carry a public "Verify this receipt" link). "true" or "false"
      (default).
    required: false
    default: "false"
  pr-comment:
    description: >-
      Upsert one sticky PR comment carrying this run's receipt. Applies
      only when the triggering event is `pull_request` AND the job has
      `permissions: pull-requests: write` — otherwise this is skipped with
      a log line, never a failure. Deliberately NOT active on
      `pull_request_target`: replaying PR-controlled skill files in a
      context that carries secrets and a write token is the classic
      fork-PR attack shape, and this action refuses to encourage it.
      "true" (the default) or "false".
    required: false
    default: "true"

outputs:
  passed:
    description: "\"true\" or \"false\" — the run record's own `passed` field."
    value: ${{ steps.run-skill.outputs.passed }}
  run-record-path:
    description: "Path to the .reelier/runs/<skill-name>.jsonl file written by this run, if any."
    value: ${{ steps.write-summary.outputs.record-path }}
  receipt-url:
    description: >-
      The public receipt URL, populated when `share: "true"` was set and
      the push step succeeded in minting one. Empty otherwise (share not
      requested, no cloud-key, or the push failed) — never fabricated.
    value: ${{ steps.push-cloud.outputs.receipt-url }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install reelier
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      # Exact-pinned, not `reelier@^0.12`-style: reelier is still 0.x, so a
      # caret range only floats the PATCH digit — `^0.12` tops out at
      # 0.12.1, never reaching 0.25.0+. That's exactly the bug that used
      # to live here (see the `cli-version` input's description above).
      run: npm install -g "reelier@${CLI_VERSION}"

    - name: Run skill (reelier run)
      id: run-skill
      shell: bash
      env:
        SKILL: ${{ inputs.skill }}
        MAX_LEVEL: ${{ inputs.max-level }}
        VARS: ${{ inputs.vars }}
        WRAP: ${{ inputs.wrap }}
      run: |
        set +e
        VAR_ARGS=()
        if [ -n "$VARS" ]; then
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            VAR_ARGS+=(--var "$line")
          done <<< "$VARS"
        fi

        WRAP_ARGS=()
        if [ -n "$WRAP" ]; then
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            WRAP_ARGS+=(--wrap "$line")
          done <<< "$WRAP"
        fi

        echo "::group::reelier run $SKILL --max-level $MAX_LEVEL"
        reelier run "$SKILL" --max-level "$MAX_LEVEL" "${VAR_ARGS[@]}" "${WRAP_ARGS[@]}"
        RUN_EXIT_CODE=$?
        echo "::endgroup::"

        echo "exit-code=$RUN_EXIT_CODE" >> "$GITHUB_OUTPUT"
        if [ "$RUN_EXIT_CODE" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Push receipt to the ledger
      id: push-cloud
      if: ${{ inputs.cloud-key != '' && steps.run-skill.outputs.passed == 'true' }}
      shell: bash
      env:
        SKILL: ${{ inputs.skill }}
        REELIER_CLOUD_URL: ${{ inputs.cloud-url }}
        REELIER_CLOUD_KEY: ${{ inputs.cloud-key }}
        SHARE: ${{ inputs.share }}
      run: |
        set +e
        SHARE_ARGS=()
        if [ "$SHARE" = "true" ]; then
          SHARE_ARGS+=(--share)
        fi

        echo "::group::reelier push $SKILL"
        PUSH_OUTPUT=$(reelier push "$SKILL" "${SHARE_ARGS[@]}" 2>&1)
        PUSH_EXIT_CODE=$?
        printf '%s\n' "$PUSH_OUTPUT"
        echo "::endgroup::"
        if [ "$PUSH_EXIT_CODE" -eq 0 ]; then
          echo "status=pushed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
        # Only set when this push also carried `--share` (see the `share`
        # input above) and the cloud actually minted a public receipt token
        # — absent otherwise, never fabricated.
        RECEIPT_URL=$(printf '%s\n' "$PUSH_OUTPUT" | grep -oE 'Receipt: https://\S+' | head -1 | sed 's/^Receipt: //')
        echo "receipt-url=$RECEIPT_URL" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Write job summary
      id: write-summary
      shell: bash
      env:
        SKILL_PATH: ${{ inputs.skill }}
        RUN_EXIT_CODE: ${{ steps.run-skill.outputs.exit-code }}
        CLOUD_PUSH_STATUS: ${{ inputs.cloud-key == '' && 'skipped' || steps.run-skill.outputs.passed != 'true' && 'not-attempted' || steps.push-cloud.outputs.status }}
      run: node "${{ github.action_path }}/.github/scripts/gha-summary.mjs"

    - name: Post PR receipt comment
      id: pr-comment
      if: always()
      shell: bash
      env:
        PR_COMMENT: ${{ inputs.pr-comment }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SKILL_PATH: ${{ inputs.skill }}
        MAX_LEVEL: ${{ inputs.max-level }}
        RUN_EXIT_CODE: ${{ steps.run-skill.outputs.exit-code }}
        CLOUD_KEY_SET: ${{ inputs.cloud-key != '' && 'true' || 'false' }}
        RECEIPT_URL: ${{ steps.push-cloud.outputs.receipt-url }}
      run: |
        set +e
        if [ "$PR_COMMENT" != "true" ]; then
          echo "pr-comment input is false — skipping PR comment."
          exit 0
        fi
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "not a PR event ($EVENT_NAME) — skipping PR comment."
          exit 0
        fi
        # This never fails the job: any failure inside the script prints one
        # WARNING line and the script itself exits 0 — see
        # .github/scripts/gha-pr-comment.mjs's own doc comment.
        node "${{ github.action_path }}/.github/scripts/gha-pr-comment.mjs"
        exit 0

    - name: Fail the check if the replay failed
      shell: bash
      env:
        RUN_EXIT_CODE: ${{ steps.run-skill.outputs.exit-code }}
        SKILL: ${{ inputs.skill }}
      run: |
        if [ "$RUN_EXIT_CODE" != "0" ]; then
          echo "Reelier replay of '$SKILL' failed (exit $RUN_EXIT_CODE) — see the job summary and log above." >&2
          exit "$RUN_EXIT_CODE"
        fi
