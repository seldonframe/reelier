name: Publish Docker image

# Builds the image on every relevant PR (validation, no push) and publishes it
# to GitHub Container Registry (ghcr.io/seldonframe/reelier) on tags + releases.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    # Tag/release publishes queue on the mission-#1 environment reviewer; the PR
    # validation path evaluates to '' and runs ungated.
    environment: ${{ github.event_name != 'pull_request' && 'production-release' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release guard below can compute a merge-base.
          # Harmless on the PR path, where the guard does not run.
          fetch-depth: 0

      # Tag pushes and published releases only — on a PR the ref is a merge ref
      # and the question is meaningless. Refuses to publish an image built from
      # a tag the default branch does not contain.
      - name: Release guard — tag must be an ancestor of main
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-ancestor.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          node-version: 24

      # The signed release-authorization artifact set lives on an out-of-band
      # ref namespace — fetch it explicitly before the verifier reads it.
      # Tags-only (R5), same condition as the ancestor guard above: the PR
      # validation path and the `release: published` non-tag edge case never
      # need it.
      - name: Fetch release-authorization refs
        if: startsWith(github.ref, 'refs/tags/')
        run: git fetch origin "+refs/reelier/*:refs/reelier/*"

      - name: Install and build (release verifier prerequisite)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm ci
          npm run build

      # Tags-only (R5): the ref argument carries a fixed, hard-coded prefix —
      # only the suffix is runtime-supplied, via the shell variable
      # $GITHUB_REF_NAME, never a raw ${{ github.ref_name }} expression
      # interpolated into the script.
      - name: Verify release authorization (offline, fail closed)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-authorization.mjs --ref "refs/reelier/release-authorizations/$GITHUB_REF_NAME" --check-head

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/seldonframe/reelier
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
