name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  test:
    # Cross-platform: reelier ships to npm and runs on contributors' machines,
    # so a Windows-only bug (e.g. the CRLF line-ending trap) must fail HERE, in
    # the PR, not as a surprise red badge on main. fail-fast:false so one OS's
    # failure still reports the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Belt-and-suspenders, not a fix for anything seen on this runner:
      # actions/checkout@v4 always starts from an empty workspace and
      # nothing here caches dist/dist-test, so there is nothing to clean
      # today. It's here because tsc does not delete output for source
      # files that no longer exist — a stale dist-test can keep running (and
      # counting) a compiled test whose source was renamed or deleted, which
      # is exactly the kind of thing an future "speed up CI" cache on these
      # directories would reintroduce silently. Cheap now, guards later.
      - name: Clean build output
        shell: bash
        run: rm -rf dist dist-test
      - run: npm run build
      # `shell: bash` is explicit (not just the Linux default) because it
      # also runs on windows-latest via the runner's bundled Git Bash — the
      # `tee`/`pipefail` combo below needs one shell that behaves the same
      # on both matrix legs so the captured output and the exit code stay
      # trustworthy on Windows too.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # The badge is OS-independent, so this only needs to run once. It
      # reads the output captured by the step above rather than re-running
      # `npm test`, so the badge-vs-suite check (scripts/check-badge.mjs,
      # sharing its rule with `npm run preflight` via scripts/badge-check.mjs)
      # runs on every PR without doubling the cost of the job.
      # runner.os (not matrix.os) so this tracks the actual OS the job ran
      # on rather than a runner-image label — immune to e.g. GitHub renaming
      # or retiring the "ubuntu-latest" image name. Must agree with
      # badge-check.mjs's CANONICAL_PLATFORM; test/action-version-pin.test.ts
      # -style, test/badge-check.test.ts asserts the two can't drift apart.
      - name: Check README tests badge
        if: runner.os == 'Linux'
        run: node scripts/check-badge.mjs test-output.txt
