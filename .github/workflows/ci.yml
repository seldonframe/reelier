name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Manual trigger, kept for one reason: `test (ubuntu-latest)` and
  # `test (windows-latest)` are REQUIRED status checks on main, so when no run
  # is created there is no way to merge and no way to ask for one.
  #
  # That is not hypothetical. During the GitHub Actions incident of 2026-08-06
  # (critical, ~15:22Z onward) webhook triggers were throttled and "many push
  # and pull request events" created no workflow runs at all. Seven PRs merged
  # with zero checks reported, and open PRs were stuck BLOCKED on contexts that
  # could never arrive — with no recourse, because every trigger above is
  # event-driven.
  #
  # `gh workflow run ci.yml --ref <branch>` gives a real pass/fail signal.
  #
  # MEASURED 2026-08-06, and the answer is the limiting one: a dispatched run
  # does NOT satisfy branch protection. Its check-runs DO attach to the head
  # SHA (both legs green on `fix/badge-linux-count`), but the PR's
  # statusCheckRollup stayed 0 and mergeable_state stayed `blocked` with the
  # branch up to date — GitHub does not associate a workflow_dispatch check
  # suite with the pull request. So this trigger is a DIAGNOSTIC tool, not a
  # merge escape hatch. During an outage the only way to land a PR is still an
  # admin override.
  #
  # It earned its place anyway: the first dispatched run after this was added
  # caught main sitting red on a badge mismatch that the incident had hidden.
  #
  # Note: the dispatch reads the workflow file from the TARGET ref, so a branch
  # cut before this trigger existed returns HTTP 422 and must be rebased first.
  workflow_dispatch:

jobs:
  pack-authority-host-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:authority-contract
      - name: Pack authority host boundary once
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(node -e 'const x=require("child_process").execFileSync("npm",["pack","--ignore-scripts","--json"],{encoding:"utf8"}); process.stdout.write(JSON.parse(x)[0].filename)')"
          sha256sum "$tarball" | awk '{print $1}' > authority-host-boundary.sha256
          node --input-type=module -e 'import { AUTHORITY_ADAPTER_CONTRACT_V1_DIGEST } from "./dist/authority/index.js"; console.log(AUTHORITY_ADAPTER_CONTRACT_V1_DIGEST)' > authority-adapter-contract.digest
          printf '%s\n' '${{ github.sha }}' > authority-workflow-source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: authority-host-boundary-pack
          path: |
            *.tgz
            authority-host-boundary.sha256
            authority-adapter-contract.digest
            authority-workflow-source.sha
  produce-authority-factory-evidence:
    needs: pack-authority-host-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: authority-host-boundary-pack
          path: authority-host-boundary-pack
      - name: Verify packed provenance and produce public factory evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat authority-host-boundary-pack/authority-workflow-source.sha)" = '${{ github.sha }}'
          test "$(sha256sum authority-host-boundary-pack/*.tgz | awk '{print $1}')" = "$(cat authority-host-boundary-pack/authority-host-boundary.sha256)"
          test "$(node --input-type=module -e 'import { AUTHORITY_ADAPTER_CONTRACT_V1_DIGEST } from "./dist/authority/index.js"; console.log(AUTHORITY_ADAPTER_CONTRACT_V1_DIGEST)')" = "$(cat authority-host-boundary-pack/authority-adapter-contract.digest)"
          node test/packed/authority-factory-journey.mjs --tarball "$(pwd)/authority-host-boundary-pack/$(basename authority-host-boundary-pack/*.tgz)" --out "$(pwd)/factory-evidence"
          node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync, writeFileSync } from "node:fs"; const d=p=>"sha256:"+createHash("sha256").update(readFileSync(p)).digest("hex"), files=["factory-evidence/graph.json","factory-evidence/trust-pin.json","factory-evidence/factory-journey-summary.json"], bytes=Buffer.concat(files.map(readFileSync)); if(/(bearer|credential|privateKey|token)/i.test(bytes.toString("utf8"))) throw new Error("secret canary failed"); const metadata={v:"reelier.factory-evidence-metadata/v1",workflowSourceSha:"${{ github.sha }}",tarballSha256:readFileSync("authority-host-boundary-pack/authority-host-boundary.sha256","utf8").trim(),adapterContractDigest:readFileSync("authority-host-boundary-pack/authority-adapter-contract.digest","utf8").trim(),graphDigest:d(files[0]),trustPinDigest:d(files[1]),summaryDigest:d(files[2]),secretCanaryResult:"empty"}; if(JSON.stringify(Object.keys(metadata).sort())!==JSON.stringify(["adapterContractDigest","graphDigest","secretCanaryResult","summaryDigest","tarballSha256","trustPinDigest","v","workflowSourceSha"])) throw new Error("closed metadata mismatch"); writeFileSync("factory-evidence/factory-evidence-metadata.json", JSON.stringify(metadata)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: authority-factory-public-evidence
          path: factory-evidence
  test:
    needs: [pack-authority-host-boundary, produce-authority-factory-evidence]
    # `always()` keeps both required contexts visible on pack failure; the first
    # failing step below prevents visible-but-skipped contexts from going green.
    if: ${{ always() }}
    # Cross-platform: reelier ships to npm and runs on contributors' machines,
    # so a Windows-only bug (e.g. the CRLF line-ending trap) must fail HERE, in
    # the PR, not as a surprise red badge on main. fail-fast:false so one OS's
    # failure still reports the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enforce authority pack and factory evidence prerequisites
        if: ${{ always() }}
        shell: bash
        run: |
          if [ '${{ needs.pack-authority-host-boundary.result }}' != 'success' ] || [ '${{ needs.produce-authority-factory-evidence.result }}' != 'success' ]; then exit 1; fi
      - uses: actions/checkout@v4
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
      # Belt-and-suspenders, not a fix for anything seen on this runner:
      # actions/checkout@v4 always starts from an empty workspace and
      # nothing here caches dist/dist-test, so there is nothing to clean
      # today. It's here because tsc does not delete output for source
      # files that no longer exist — a stale dist-test can keep running (and
      # counting) a compiled test whose source was renamed or deleted, which
      # is exactly the kind of thing an future "speed up CI" cache on these
      # directories would reintroduce silently. Cheap now, guards later.
      - name: Clean build output
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        shell: bash
        run: rm -rf dist dist-test
      - run: npm run build
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
      - name: Compile test checkout
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        run: npx tsc -p tsconfig.test.json --pretty false
      - uses: actions/download-artifact@v4
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        with:
          name: authority-host-boundary-pack
          path: authority-host-boundary-pack
      - uses: actions/download-artifact@v4
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        with:
          name: authority-factory-public-evidence
          path: authority-factory-public-evidence
      - name: Verify public factory evidence offline
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -e 'const x=require("node:crypto"),f=require("node:fs");process.stdout.write("sha256:"+x.createHash("sha256").update(f.readFileSync("authority-factory-public-evidence/graph.json")).digest("hex"))')" = "$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("authority-factory-public-evidence/factory-evidence-metadata.json")).graphDigest)')"
          node test/packed/authority-factory-journey.mjs --tarball "$(pwd)/authority-host-boundary-pack/$(basename authority-host-boundary-pack/*.tgz)" --verify-evidence "$(pwd)/authority-factory-public-evidence"
      - name: Verify downloaded authority pack provenance
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat authority-host-boundary-pack/authority-workflow-source.sha)" = '${{ github.sha }}'
          test "$(sha256sum authority-host-boundary-pack/*.tgz | awk '{print $1}')" = "$(cat authority-host-boundary-pack/authority-host-boundary.sha256)"
          test "$(node --input-type=module -e 'import { AUTHORITY_ADAPTER_CONTRACT_V1_DIGEST } from "./dist/authority/index.js"; console.log(AUTHORITY_ADAPTER_CONTRACT_V1_DIGEST)')" = "$(cat authority-host-boundary-pack/authority-adapter-contract.digest)"
      - name: Verify downloaded package boundary on native OS
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        shell: bash
        run: |
          if [ '${{ matrix.os }}' = 'ubuntu-latest' ]; then node test/packed/authority-host-boundary.mjs --tarball "$(pwd)/authority-host-boundary-pack/$(basename authority-host-boundary-pack/*.tgz)" --mode surface; else node test/packed/authority-host-boundary.mjs --tarball "$(pwd)/authority-host-boundary-pack/$(basename authority-host-boundary-pack/*.tgz)" --mode windows-native; fi
      - name: Run native authority platform evidence
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        shell: bash
        run: |
          if [ '${{ matrix.os }}' = 'ubuntu-latest' ]; then node --test --test-concurrency=1 --test-name-pattern='^N100 authority convergence:' dist-test/test/authority/ledger.test.js; else node --test --test-concurrency=1 dist-test/test/authority/linux-authority-cell.test.js dist-test/test/authority/authority-cell-connection.test.js dist-test/test/authority/certification-portable-evidence.test.js; fi
      # `shell: bash` is explicit (not just the Linux default) because it
      # also runs on windows-latest via the runner's bundled Git Bash — the
      # `tee`/`pipefail` combo below needs one shell that behaves the same
      # on both matrix legs so the captured output and the exit code stay
      # trustworthy on Windows too.
      - name: Run supported tests
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          if [ '${{ matrix.os }}' = 'ubuntu-latest' ]; then npm test 2>&1 | tee test-output.txt; else node --test --test-concurrency=1 dist-test/test/authority/package.test.js dist-test/test/authority/linux-authority-cell.test.js dist-test/test/authority/authority-cell-connection.test.js dist-test/test/authority/certification-portable-evidence.test.js; fi
      # The badge is OS-independent, so this only needs to run once. It
      # reads the output captured by the step above rather than re-running
      # `npm test`, so the badge-vs-suite check (scripts/check-badge.mjs,
      # sharing its rule with `npm run preflight` via scripts/badge-check.mjs)
      # runs on every PR without doubling the cost of the job.
      # runner.os (not matrix.os) so this tracks the actual OS the job ran
      # on rather than a runner-image label — immune to e.g. GitHub renaming
      # or retiring the "ubuntu-latest" image name. Must agree with
      # badge-check.mjs's CANONICAL_PLATFORM; test/action-version-pin.test.ts
      # -style, test/badge-check.test.ts asserts the two can't drift apart.
      - name: Check README tests badge
        if: ${{ needs.pack-authority-host-boundary.result == 'success' && needs.produce-authority-factory-evidence.result == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: if [ '${{ runner.os }}' = 'Linux' ]; then node scripts/check-badge.mjs test-output.txt; fi
