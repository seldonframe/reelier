name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  test:
    # Cross-platform: reelier ships to npm and runs on contributors' machines,
    # so a Windows-only bug (e.g. the CRLF line-ending trap) must fail HERE, in
    # the PR, not as a surprise red badge on main. fail-fast:false so one OS's
    # failure still reports the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
