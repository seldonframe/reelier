# Publishes reelier to npm on release tags — the governed fourth workflow.
# This path is digest-bound in RELEASE_WORKFLOWS (src/authority/release-contracts.ts):
# any edit here changes the workflow digest every signed StagedCandidateManifestV1 pins.
# Auth: npm Trusted Publisher via GitHub OIDC (admin checklist, spec section 6) — no token secret.
#
# The authorization-signer trust pin (R4) is read only from the committed file
# release/trust/release-authorization-signer.json (landed by the D1 infra PR)
# — never from repo/environment variables: the verifier script treats any
# signer override supplied that way as a hard failure, not an ignored
# fallback.
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

# Per-version concurrency: one publish attempt per tag, never cancelled mid-publish.
concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the ancestor guard and the verifier's --check-head
          # both compute against parent commits, impossible at depth 1.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Release guard — tag must be an ancestor of main
        run: node scripts/check-release-ancestor.mjs

      # The signed release-authorization artifact set lives on an out-of-band
      # ref namespace, not in the normal branch/tag history actions/checkout
      # follows — it has to be fetched explicitly before the verifier can
      # read it.
      - name: Fetch release-authorization refs
        run: git fetch origin "+refs/reelier/*:refs/reelier/*"

      - name: Install and build (release verifier prerequisite)
        run: |
          npm ci
          npm run build

      # The ref argument carries a fixed, hard-coded prefix
      # (refs/reelier/release-authorizations/) — only the suffix is
      # runtime-supplied, via the shell variable $GITHUB_REF_NAME (a
      # GitHub Actions default env var, not a custom mapping). It is never
      # a raw ${{ github.ref_name }} expression interpolated into the
      # run: script, and it never appears as a bare standalone argv token
      # a value like "--help" could be read as — always inside this one
      # quoted --ref argument.
      - name: Verify release authorization (offline, fail closed)
        run: node scripts/verify-release-authorization.mjs --ref "refs/reelier/release-authorizations/$GITHUB_REF_NAME" --check-head --emit /tmp/verified-release.json

      - name: Pack
        run: npm pack

      # Tarball digest must equal the signed StagedCandidateManifestV1's
      # packedTarballDigest — the verifier script performs this comparison
      # itself and refuses (exit 1) on any mismatch. Same fixed-prefix +
      # $GITHUB_REF_NAME construction as the step above.
      - name: Tarball digest must equal the signed manifest value
        run: node scripts/verify-release-authorization.mjs --ref "refs/reelier/release-authorizations/$GITHUB_REF_NAME" --tarball "reelier-$(node -p "require('./package.json').version").tgz"

      # Runs BEFORE publish and before any retry: matching published integrity ->
      # reconciled success (publish skipped); conflicting -> terminal failure;
      # uncertain -> pending (exit 2), never resent.
      - name: Destination reconciliation — refuse duplicate or conflicting publish
        id: reconcile
        run: node scripts/reconcile-npm-destination.mjs --package reelier --version "$(node -p "require('./package.json').version")" --tarball "reelier-$(node -p "require('./package.json').version").tgz"

      # A prerelease must never replace the stable `latest` pointer. The
      # resolver accepts a closed SemVer surface and maps every prerelease to
      # the beta channel; malformed or build-only versions fail the release.
      - name: Resolve governed npm dist-tag
        id: npm_dist_tag
        run: echo "tag=$(node scripts/resolve-npm-dist-tag.mjs --version "$(node -p "require('./package.json').version")")" >> "$GITHUB_OUTPUT"

      # Publishes the exact digest-checked tarball file: npm does not re-pack or run
      # pack scripts for a tarball path, so the published bytes are the verified bytes.
      - name: Publish to npm with provenance
        if: steps.reconcile.outputs.state == 'absent'
        env:
          NPM_DIST_TAG: ${{ steps.npm_dist_tag.outputs.tag }}
        run: npm publish "reelier-$(node -p "require('./package.json').version").tgz" --tag "$NPM_DIST_TAG" --provenance --access public

      - name: Post-publish destination reconciliation
        if: steps.reconcile.outputs.state == 'absent'
        run: node scripts/reconcile-npm-destination.mjs --package reelier --version "$(node -p "require('./package.json').version")" --tarball "reelier-$(node -p "require('./package.json').version").tgz" --expect reconciled
