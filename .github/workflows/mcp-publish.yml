# Publishes server.json to the Official MCP Registry (registry.modelcontextprotocol.io)
# Auth: GitHub OIDC — no secrets needed for the io.github.seldonframe/* namespace.
# Downstream: GitHub MCP Registry -> VS Code @mcp gallery; PulseMCP ingests daily; Smithery/Glama mirror.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Mission-#1 pre-publish human review gate (spec 2.1). The environment reference
    # stays after the required reviewer is removed; it then gates nothing.
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release guard below computes a merge-base, which
          # is impossible at the default depth of 1.
          fetch-depth: 0

      # Refuses to publish a tag that is not on the default branch. 0.31.1 was
      # published off-branch, so a breaking verify guard reached npm and never
      # reached main. See scripts/check-release-ancestor.mjs.
      - name: Release guard — tag must be an ancestor of main
        run: node scripts/check-release-ancestor.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          node-version: 24

      # The signed release-authorization artifact set lives on an out-of-band
      # ref namespace, not in the normal branch/tag history actions/checkout
      # follows — it has to be fetched explicitly before the verifier can
      # read it. Tags-only (R5): the pre-existing workflow_dispatch path has
      # no release tag and no authorization ref to fetch, so this step is
      # skipped on that path — but the job-level `environment:
      # production-release` above still applies to every run, dispatch
      # included, and gates it on the mission-#1 required reviewer before any
      # step executes. That gate is deliberate: all three publish workflows
      # carry it during mission #1.
      - name: Fetch release-authorization refs
        if: startsWith(github.ref, 'refs/tags/')
        run: git fetch origin "+refs/reelier/*:refs/reelier/*"

      - name: Install and build (release verifier prerequisite)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm ci
          npm run build

      # Tags-only (R5): tag-triggered runs are always verified; on the
      # pre-existing workflow_dispatch path this step itself does not run —
      # step execution is unchanged there — but the run as a whole still
      # waits on the job-level `environment: production-release` approval
      # above before any step, this one included, can start. The ref
      # argument carries a fixed, hard-coded prefix — only the suffix is
      # runtime-supplied, via the shell variable $GITHUB_REF_NAME, never a
      # raw ${{ github.ref_name }} expression interpolated into the script.
      - name: Verify release authorization (offline, fail closed)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-authorization.mjs --ref "refs/reelier/release-authorizations/$GITHUB_REF_NAME" --check-head

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
