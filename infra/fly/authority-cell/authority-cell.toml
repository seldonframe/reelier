primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "authority serve --transport http --host 0.0.0.0 --port 8080 --path /data/authority/authority.yml --certification-config /data/authority/certification.local.json"

[env]
  REELIER_TOPOLOGY_MODE = "managed"
  REELIER_AGENT_PROVIDER_EGRESS = "deny"
  REELIER_RAW_WRITE_ROUTES = "deny"
  REELIER_LEDGER_MODE = "durable"

[[mounts]]
  source = "reelier_authority_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

# Mount provider grants only through Fly secrets. Never commit values here.
